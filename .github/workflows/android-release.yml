name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: '1.0.48'
      VERSION_CODE: '60'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 校验版本号一致
        run: |
          python3 - <<'EOF'
          import os, re, sys
          src = open('app/build.gradle', encoding='utf-8').read()
          name = re.search(r'versionName\s+"([^"]+)"', src).group(1)
          code = re.search(r'versionCode\s+(\d+)', src).group(1)
          env_name = os.environ['VERSION_NAME']
          env_code = os.environ['VERSION_CODE']
          tag = os.environ.get('GITHUB_REF_NAME', '')
          print(f'gradle={name}/{code} workflow={env_name}/{env_code} tag={tag}')
          if name != env_name or code != env_code:
              sys.exit('版本号不一致：app/build.gradle 与 workflow env')
          if tag.startswith('v') and tag != 'v' + name:
              sys.exit(f'tag {tag} 与版本号 v{name} 不一致')
          EOF

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo '缺少 Secret: KEYSTORE_BASE64'; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | tail -n 2

      - name: 构建 Release APK
        env:
          KS_FILE: ${{ runner.temp }}/release.jks
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: 校验签名与包体
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_SDK_ROOT/build-tools/"*/ | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signing.txt
          # 统一发布密钥指纹（release.jks，apksigner 输出的 SHA-256 为小写无冒号）
          grep -qi '13fbc983ce20b3dc7bfbbbc13327b39769209ebe84ad146d7c89fe582c00fbde' signing.txt \
            || (echo '签名指纹与统一发布密钥不一致'; exit 1)
          AAPT="$BT/aapt"
          [ -x "$AAPT" ] || AAPT="$BT/aapt2"
          "$AAPT" dump badging "$APK" | tee badging.txt | grep -E "package:|uses-permission:" | head -20
          grep -q "versionName='$VERSION_NAME'" badging.txt \
            || (echo 'APK versionName 不符'; exit 1)

      - name: 改名并上传产物
        run: |
          mkdir -p out
          # GitHub 会把 Release 资产名里的中文抹掉，统一用 ASCII 名；
          # 客户端同时认「闲观-vX.Y.Z.apk」和「xianguan-vX.Y.Z.apk」
          cp app/build/outputs/apk/release/app-release.apk "out/xianguan-v${VERSION_NAME}.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: xianguan-apk
          path: out/*.apk

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<EOF
          闲观（安卓）v${VERSION_NAME}

          - 更新检测改为直连飞机盘分享接口（不再依赖隐藏 WebView），失败提示带 HTTP 码、内容类型与实际地址
          - 安装包下载到系统「下载」目录，完成后自动调起系统安装器

          ⚠️ 本版起改用统一发布签名，与 1.0.47 及更早版本签名不同。
          老用户必须先卸载旧版再安装本版（卸载会清空应用内设置）。
          EOF
          gh release create "v${VERSION_NAME}" "out/xianguan-v${VERSION_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "闲观 v${VERSION_NAME}" \
            --notes-file notes.md
